[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finqa-mcp-agent"
version = "0.2.0"
description = "Local financial question answering with source-aware MCP tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.12,<2",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "PyYAML>=6,<7",
    "jsonschema>=4.26,<5",
    "tokenizers>=0.22,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
finqa = "finqa_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["finqa_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests/final"]
pythonpath = ["src"]
